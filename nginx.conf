# Nginx config for louisvillemakesgames.org
# Place at /etc/nginx/sites-available/louisvillemakesgames.org
# then: sudo ln -s /etc/nginx/sites-available/louisvillemakesgames.org /etc/nginx/sites-enabled/
# then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name louisvillemakesgames.org www.louisvillemakesgames.org;

    # ---- Uncomment after running certbot: ----
    # return 301 https://$host$request_uri;
    # ---- Until then, serve over HTTP: -------
    root /var/www/louisvillemakesgames.org;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets aggressively
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|css|js|woff2?|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

